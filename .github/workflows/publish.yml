name: Publish iOS SDK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    environment: cocoapods-release
    env:
      PODSPEC_PATH: BubblSDK.podspec

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2

      - name: Verify Trunk session
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk me

      - name: Verify tag matches podspec version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          SPEC_VERSION="$(ruby -e 'spec = File.read(ENV.fetch("PODSPEC_PATH")); puts spec[/spec\.version\s*=\s*"([^"]+)"/, 1]')"

          if [ -z "$SPEC_VERSION" ]; then
            echo "Could not determine podspec version from ${PODSPEC_PATH}"
            exit 1
          fi

          if [ "$TAG" != "$SPEC_VERSION" ]; then
            echo "Git tag '${TAG}' must exactly match podspec version '${SPEC_VERSION}'."
            exit 1
          fi

      - name: Lint podspec
        run: pod spec lint "${PODSPEC_PATH}" --allow-warnings --verbose

      - name: Publish to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: pod trunk push "${PODSPEC_PATH}" --allow-warnings --verbose
